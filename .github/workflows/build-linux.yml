name: Build Linux

# Baut die Linux-Binary auf GitHubs kostenlosen Ubuntu-Runnern und haengt sie beim
# Tag-Push v* ans Release. webview_go linkt fest gegen webkit2gtk-4.0; da 4.0 auf
# aktuellen Distros (Arch, Ubuntu 24.04) nicht mehr Standard ist, bauen wir gegen
# webkit2gtk-4.1 und leiten den 4.0-pkg-config-Namen per Shim darauf um.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: WebKitGTK 4.1 installieren + pkg-config-Shim (4.0 -> 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          mkdir -p "$HOME/pcshim"
          {
            echo "Name: webkit2gtk-4.0"
            echo "Description: Shim, verweist auf webkit2gtk-4.1"
            echo "Version: 2.44.0"
            echo "Requires: webkit2gtk-4.1"
          } > "$HOME/pcshim/webkit2gtk-4.0.pc"

      - name: Linux-Binary bauen (gegen 4.1)
        run: |
          export PKG_CONFIG_PATH="$HOME/pcshim:$(pkg-config --variable pc_path pkg-config)"
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o sc-cargo-manager-linux .
          chmod +x sc-cargo-manager-linux
          echo "=== verlinkte webkit-Bibliothek ==="
          ldd sc-cargo-manager-linux | grep -i webkit || true
          file sc-cargo-manager-linux

      - name: Als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: sc-cargo-manager-linux
          path: sc-cargo-manager-linux

      - name: Ans Release haengen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sc-cargo-manager-linux
